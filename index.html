<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker de Tareas - Realtime</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* --- TU DISEÑO ORIGINAL --- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f3; --surface: #ffffff; --border: #e4e2dc; --border-strong: #ccc9c0;
  --text: #1a1916; --text-muted: #7a7870; --text-faint: #b0ada5;
  --accent: #1D9E75; --accent-bg: #e1f5ee; --accent-text: #0a5c42;
  --warn: #c4620f; --danger: #b92b2b; --danger-bg: #fcebeb; --danger-text: #7a1a1a;
  --radius: 8px; --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 3rem; }
.site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.1rem 1.5rem; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow); }
.site-header h1 { font-size: 17px; font-weight: 500; flex: 1; }
.btn-back { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.page { display: none; }
.page.active { display: block; }
.container { max-width: 100%; padding: 1.25rem; }
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
.form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.form-group label { font-size: 11px; color: var(--text-muted); }
.form-group input, .form-group select, .form-group textarea { font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); outline: none; }
.form-row-top { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.btn-add { background: var(--accent); color: #fff; border: none; padding: 7px 18px; border-radius: var(--radius); cursor: pointer; height: 36px; align-self: flex-end; }
.folder { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 10px; padding: 14px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 10px; color: var(--text-faint); text-align: left; padding: 11px 13px; background: var(--bg); text-transform: uppercase; }
td { padding: 11px 13px; font-size: 13px; border-bottom: 1px solid var(--border); }
.task-desc { font-size: 11px; color: var(--text-muted); background: #fafaf8; padding: 8px 13px; border-bottom: 1px solid var(--border); }
.editable-input { border: 1px dashed transparent; background: none; font-family: inherit; font-size: inherit; width: 100%; cursor: pointer; }
.editable-input:hover { border-color: var(--border-strong); }
.editable-input:focus { border-style: solid; border-color: var(--accent); background: #fff; cursor: text; }
</style>
</head>
<body>

<div class="page active" id="pg-home">
  <header class="site-header"><h1>Tracker de Tareas</h1></header>
  <main class="container">
    <div class="form-card">
      <div class="form-row-top">
        <div class="form-group" style="flex:3"><label>Tarea</label><input type="text" id="inp-tarea"></div>
        <div class="form-group" style="flex:2"><label>Responsable</label>
          <select id="inp-resp">
            <option value="">— Seleccionar —</option>
            <option value="María Balestrini">María Balestrini</option>
            <option value="Ignacio Ríos">Ignacio Ríos</option>
          </select>
        </div>
        <div class="form-group"><label>Entrega</label><input type="date" id="inp-fecha"></div>
        <div class="form-group"><label>Hora</label><input type="time" id="inp-hora"></div>
      </div>
      <div style="display:flex; gap:8px">
        <div class="form-group"><label>Detalles</label><textarea id="inp-desc" rows="2"></textarea></div>
        <button class="btn-add" onclick="addTask()">+ Agregar</button>
      </div>
    </div>
    <div class="folder" onclick="goTo('mary')"><span>MB</span> <strong>Mary</strong></div>
    <div class="folder" onclick="goTo('nacho')"><span>IR</span> <strong>Nacho</strong></div>
  </main>
</div>

<div class="page" id="pg-persona">
  <header class="site-header">
    <button class="btn-back" onclick="goTo('home')">← Volver</button>
    <h1 id="persona-titulo">Tareas</h1>
  </header>
  <main class="container">
    <div class="table-card">
      <table>
        <thead><tr><th>✓</th><th>Tarea / Detalles</th><th>Fecha</th><th>Hora</th><th></th></tr></thead>
        <tbody id="tbody-tasks"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBJUzoXkS-x6t4sbR-RePchWSD2923x2Vg",
    authDomain: "tareas-b31fa.firebaseapp.com",
    projectId: "tareas-b31fa",
    storageBucket: "tareas-b31fa.firebasestorage.app",
    messagingSenderId: "121581147046",
    appId: "1:121581147046:web:4d30f237e4924dcb3db567"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const tasksRef = collection(db, "tareas_equipo");

  let currentPersona = "";
  let tasks = [];

  window.goTo = (id) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    if(id === 'home') {
        document.getElementById('pg-home').classList.add('active');
    } else {
        currentPersona = id === 'mary' ? 'María Balestrini' : 'Ignacio Ríos';
        document.getElementById('persona-titulo').innerText = "Tareas de " + (id === 'mary' ? 'Mary' : 'Nacho');
        document.getElementById('pg-persona').classList.add('active');
    }
    render();
  };

  window.addTask = async () => {
    const tarea = document.getElementById('inp-tarea').value;
    const resp = document.getElementById('inp-resp').value;
    const fecha = document.getElementById('inp-fecha').value;
    if(!tarea || !resp) return alert("Pon nombre y responsable");

    await addDoc(tasksRef, {
      tarea, resp, fecha: fecha || "9999-12-31", // Fecha lejana si está vacío para que vaya al final
      hora: document.getElementById('inp-hora').value || "",
      desc: document.getElementById('inp-desc').value || "",
      done: false, creadaEn: Date.now()
    });
    
    // Limpiar campos
    ['inp-tarea','inp-desc','inp-fecha','inp-hora'].forEach(id => document.getElementById(id).value = "");
  };

  // Función para editar campos existentes (Fecha u Hora)
  window.updateField = async (id, field, value) => {
    const val = value || (field === "fecha" ? "9999-12-31" : "");
    await updateDoc(doc(db, "tareas_equipo", id), { [field]: val });
  };

  window.toggle = async (id, status) => { await updateDoc(doc(db, "tareas_equipo", id), { done: !status }); };
  window.del = async (id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, "tareas_equipo", id)); };

  // ESCUCHAR: Ordenado por FECHA (ascendente: lo más pronto primero)
  onSnapshot(query(tasksRef, orderBy("fecha", "asc")), (snap) => {
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });

  function render() {
    const tbody = document.getElementById('tbody-tasks');
    if(!tbody || !currentPersona) return;

    const mine = tasks.filter(t => t.resp === currentPersona);
    
    tbody.innerHTML = mine.map(t => {
      const fechaMostrada = t.fecha === "9999-12-31" ? "" : t.fecha;
      return `
      <tr>
        <td style="width:40px"><input type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}', ${t.done})"></td>
        <td>
            <strong>${t.tarea}</strong>
            ${t.desc ? `<div style="font-size:11px; color:#666; margin-top:4px;">${t.desc}</div>` : ''}
        </td>
        <td><input type="date" class="editable-input" value="${fechaMostrada}" onchange="updateField('${t.id}', 'fecha', this.value)"></td>
        <td><input type="time" class="editable-input" value="${t.hora}" onchange="updateField('${t.id}', 'hora', this.value)"></td>
        <td style="width:40px"><button onclick="del('${t.id}')" style="background:none; border:none; color:red; cursor:pointer">×</button></td>
      </tr>
    `}).join('');
  }
</script>
</body>
</html>
