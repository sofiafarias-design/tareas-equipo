<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker de Tareas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* --- DISEÑO CORREGIDO --- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f3; --surface: #ffffff; --border: #e4e2dc;
  --text: #1a1916; --text-muted: #7a7870;
  --accent: #1D9E75; --danger: #b92b2b;
  --radius-lg: 12px; --shadow: 0 1px 3px rgba(0,0,0,0.06);
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 3rem; }
.site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
.container { padding: 1.25rem; }

/* Formulario */
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: var(--shadow); }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.form-group label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
input, select, textarea { padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 13px; background: var(--bg); }
.btn-add { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 500; align-self: flex-end; }

/* Carpetas Home */
.folder { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 15px; margin-bottom: 10px; display: flex; align-items: center; cursor: pointer; box-shadow: var(--shadow); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-weight: 500; }
.av-m { background: #e1f5ee; color: #0a5c42; }
.av-i { background: #e6f1fb; color: #185fa5; }

/* Stats y Filtros */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
.stat-card { background: var(--surface); padding: 10px; border-radius: var(--radius-lg); border: 1px solid var(--border); text-align: center; }
.stat-num { font-family: 'DM Mono'; font-size: 20px; display: block; }
.filters { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
.filter-btn { padding: 6px 15px; border-radius: 20px; border: 1px solid var(--border); background: white; cursor: pointer; font-size: 12px; }
.filter-btn.active { background: #1a1916; color: white; border-color: #1a1916; }

/* Tabla Corregida */
.table-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; }
th { background: var(--bg); padding: 12px; font-size: 10px; color: var(--text-muted); text-align: left; text-transform: uppercase; }
td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.date-box { display: flex; flex-direction: column; gap: 2px; } /* Evita que se amontonen las fechas */
.vencida { color: var(--danger); font-weight: 500; }
.done-text { text-decoration: line-through; color: #b0ada5; }

.page { display: none; }
.page.active { display: block; }
</style>
</head>
<body>

<div id="pg-home" class="page active">
  <header class="site-header"><h1>Tracker de Tareas</h1></header>
  <main class="container">
    <div class="form-card">
      <div class="form-row">
        <div class="form-group" style="flex:2"><label>Tarea</label><input type="text" id="inp-tarea" placeholder="¿Qué hay que hacer?"></div>
        <div class="form-group"><label>Responsable</label>
          <select id="inp-resp"><option value="Mary">Mary</option><option value="Nacho">Nacho</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Fecha</label><input type="date" id="inp-fecha"></div>
        <div class="form-group"><label>Hora</label><input type="time" id="inp-hora"></div>
        <div class="form-group"><label>Prioridad</label>
          <select id="inp-prio"><option value="Media">Media</option><option value="Alta">Alta</option><option value="Baja">Baja</option></select>
        </div>
      </div>
      <button class="btn-add" onclick="addTask()">+ Agregar Tarea</button>
    </div>
    <div class="folder" onclick="openUser('Mary')"><div class="avatar av-m">MB</div><strong>Mary</strong></div>
    <div class="folder" onclick="openUser('Nacho')"><div class="avatar av-i">IR</div><strong>Nacho</strong></div>
  </main>
</div>

<div id="pg-user" class="page">
  <header class="site-header">
    <button onclick="showHome()" style="background:none; border:none; cursor:pointer; font-size:16px; margin-right:10px">←</button>
    <h1 id="user-title">Tareas</h1>
  </header>
  <main class="container">
    <div class="stats">
      <div class="stat-card"><span class="stat-num" id="s-total">0</span><small>Total</small></div>
      <div class="stat-card"><span class="stat-num" id="s-pend" style="color:orange">0</span><small>Pend.</small></div>
      <div class="stat-card"><span class="stat-num" id="s-done" style="color:green">0</span><small>Listas</small></div>
      <div class="stat-card"><span class="stat-num" id="s-venc" style="color:red">0</span><small>Venc.</small></div>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('pendientes', this)">Pendientes</button>
      <button class="filter-btn" onclick="setFilter('completadas', this)">Completadas</button>
      <button class="filter-btn" onclick="setFilter('vencidas', this)">Vencidas</button>
      <button class="filter-btn" onclick="setFilter('todas', this)">Todas</button>
    </div>
    <div class="table-card">
      <table>
        <thead><tr><th>✓</th><th>Tarea</th><th>Entrega</th><th>Estado</th><th></th></tr></thead>
        <tbody id="task-list"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBJUzoXkS-x6t4sbR-RePchWSD2923x2Vg",
    authDomain: "tareas-b31fa.firebaseapp.com",
    projectId: "tareas-b31fa",
    storageBucket: "tareas-b31fa.firebasestorage.app",
    messagingSenderId: "121581147046",
    appId: "1:121581147046:web:4d30f237e4924dcb3db567"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const colRef = collection(db, "tareas_equipo");

  let allTasks = [];
  let currentUser = "";
  let currentFilter = "pendientes";

  window.addTask = async () => {
    const tarea = document.getElementById('inp-tarea').value;
    if(!tarea) return alert("Escribe la tarea");
    await addDoc(colRef, {
      tarea, resp: document.getElementById('inp-resp').value,
      fecha: document.getElementById('inp-fecha').value || "2099-12-31",
      hora: document.getElementById('inp-hora').value || "--:--",
      prio: document.getElementById('inp-prio').value,
      done: false, creada: Date.now()
    });
    document.getElementById('inp-tarea').value = "";
    alert("¡Agregada!");
  };

  window.openUser = (name) => {
    currentUser = name;
    document.getElementById('user-title').innerText = "Tareas de " + name;
    document.getElementById('pg-home').classList.remove('active');
    document.getElementById('pg-user').classList.add('active');
    render();
  };

  window.showHome = () => {
    document.getElementById('pg-user').classList.remove('active');
    document.getElementById('pg-home').classList.add('active');
  };

  window.setFilter = (f, btn) => {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };

  window.toggleTask = async (id, status) => {
    await updateDoc(doc(db, "tareas_equipo", id), { done: !status });
  };

  window.deleteTask = async (id) => {
    if(confirm("¿Eliminar?")) await deleteDoc(doc(db, "tareas_equipo", id));
  };

  onSnapshot(query(colRef, orderBy("creada", "desc")), (snap) => {
    allTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });

  function render() {
    const list = document.getElementById('task-list');
    if(!list || !currentUser) return;

    const hoy = new Date().toISOString().split('T')[0];
    const mine = allTasks.filter(t => t.resp === currentUser);

    // Actualizar Stats
    document.getElementById('s-total').innerText = mine.length;
    document.getElementById('s-pend').innerText = mine.filter(t => !t.done).length;
    document.getElementById('s-done').innerText = mine.filter(t => t.done).length;
    document.getElementById('s-venc').innerText = mine.filter(t => !t.done && t.fecha < hoy).length;

    // Aplicar Filtro de vista
    let filtered = mine;
    if(currentFilter === 'pendientes') filtered = mine.filter(t => !t.done);
    if(currentFilter === 'completadas') filtered = mine.filter(t => t.done);
    if(currentFilter === 'vencidas') filtered = mine.filter(t => !t.done && t.fecha < hoy);

    list.innerHTML = filtered.map(t => {
      const isVencida = !t.done && t.fecha < hoy;
      return `
        <tr>
          <td><input type="checkbox" ${t.done?'checked':''} onclick="toggleTask('${t.id}', ${t.done})"></td>
          <td class="${t.done?'done-text':''}"><strong>${t.tarea}</strong></td>
          <td>
            <div class="date-box">
              <span class="${isVencida?'vencida':''}">${t.fecha}</span>
              <small style="color:gray">${t.hora}</small>
            </div>
          </td>
          <td>${t.done ? '✅ LISTO' : '⏳ PENDIENTE'}</td>
          <td><button onclick="deleteTask('${t.id}')" style="background:none; border:none; cursor:pointer; color:#ccc">×</button></td>
        </tr>
      `;
    }).join('');
  }
</script>
</body>
</html>
