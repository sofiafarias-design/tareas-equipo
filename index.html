<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker de Tareas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* --- TUS COLORES Y DISEÑO ORIGINAL --- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f3; --surface: #ffffff; --border: #e4e2dc; --border-strong: #ccc9c0;
  --text: #1a1916; --text-muted: #7a7870; --text-faint: #b0ada5;
  --accent: #1D9E75; --accent-bg: #e1f5ee; --accent-text: #0a5c42;
  --warn: #c4620f; --danger: #b92b2b; --danger-bg: #fcebeb; --danger-text: #7a1a1a;
  --prio-alta-bg: #faece7; --prio-alta-text: #8a3018;
  --prio-media-bg: #faeeda; --prio-media-text: #7a3c08;
  --prio-baja-bg: #eaf3de; --prio-baja-text: #2e5a0a;
  --radius: 8px; --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 3rem; }
.site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.1rem 1.5rem; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow); }
.site-header h1 { font-size: 17px; font-weight: 500; flex: 1; }
.btn-back { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.page { display: none; }
.page.active { display: block; }
.container { max-width: 100%; padding: 1.25rem; }
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
.form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.form-group label { font-size: 11px; color: var(--text-muted); }
.form-group input, .form-group select, .form-group textarea { font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); outline: none; }
.form-row-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
.btn-add { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 7px 18px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; height: 36px; }
.folder { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 10px; padding: 14px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; }
.av-m { background: var(--accent-bg); color: var(--accent-text); }
.av-i { background: #e6f1fb; color: #185fa5; }
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 10px; font-weight: 500; color: var(--text-faint); text-align: left; padding: 11px 13px; text-transform: uppercase; background: var(--bg); }
td { padding: 11px 13px; font-size: 13px; border-bottom: 1px solid var(--border); }
.btn-expand { background: var(--accent-bg); border: none; cursor: pointer; color: var(--accent-text); font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; margin-top: 5px; }
.task-desc-row { background: #fafaf8; display: none; }
.task-desc-content { padding: 10px 14px; font-size: 12px; color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); margin: 0 13px 13px; }
.done-t { text-decoration: line-through; color: var(--text-faint); }
</style>
</head>
<body>

<div class="page active" id="pg-home">
  <header class="site-header"><h1>Tracker de Tareas</h1></header>
  <main class="container">
    <div class="form-card">
      <div class="form-row-top">
        <div class="form-group" style="flex:3"><label>Título</label><input type="text" id="inp-tarea"></div>
        <div class="form-group" style="flex:2">
          <label>Responsable</label>
          <select id="inp-resp">
            <option value="">— Seleccionar —</option>
            <option value="María Balestrini">María Balestrini</option>
            <option value="Ignacio Ríos">Ignacio Ríos</option>
          </select>
        </div>
        <div class="form-group"><label>Entrega</label><input type="date" id="inp-fecha"></div>
        <div class="form-group"><label>Hora</label><input type="time" id="inp-hora"></div>
      </div>
      <div style="display:flex; gap:8px; align-items: flex-end;">
        <div class="form-group"><label>Descripción</label><textarea id="inp-desc" rows="2"></textarea></div>
        <button class="btn-add" onclick="addTask()">+ Agregar</button>
      </div>
    </div>
    <div class="folder" onclick="goTo('mary')"><div class="avatar av-m">MB</div><strong>Mary</strong></div>
    <div class="folder" onclick="goTo('nacho')"><div class="avatar av-i">IR</div><strong>Nacho</strong></div>
  </main>
</div>

<div class="page" id="pg-persona">
  <header class="site-header">
    <button class="btn-back" onclick="goTo('home')">← Volver</button>
    <h1 id="persona-titulo">Tareas</h1>
  </header>
  <main class="container">
    <div class="table-card">
      <table>
        <thead><tr><th>✓</th><th>Tarea</th><th>Fecha</th><th></th></tr></thead>
        <tbody id="tbody-tasks"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBJUzoXkS-x6t4sbR-RePchWSD2923x2Vg",
    authDomain: "tareas-b31fa.firebaseapp.com",
    projectId: "tareas-b31fa",
    storageBucket: "tareas-b31fa.firebasestorage.app",
    messagingSenderId: "121581147046",
    appId: "1:121581147046:web:4d30f237e4924dcb3db567"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const tasksRef = collection(db, "tareas_equipo");

  let currentPersona = "";
  let tasks = [];

  window.goTo = (id) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    if(id === 'home') {
      document.getElementById('pg-home').classList.add('active');
      currentPersona = "";
    } else {
      currentPersona = id === 'mary' ? 'María Balestrini' : 'Ignacio Ríos';
      document.getElementById('persona-titulo').innerText = "Tareas de " + (id === 'mary' ? 'Mary' : 'Nacho');
      document.getElementById('pg-persona').classList.add('active');
    }
    render();
  };

  window.addTask = async () => {
    const tarea = document.getElementById('inp-tarea').value.trim();
    const resp = document.getElementById('inp-resp').value;
    if(!tarea || !resp) return alert("Completa Tarea y Responsable");

    await addDoc(tasksRef, {
      tarea, resp,
      fecha: document.getElementById('inp-fecha').value || "9999-12-31",
      hora: document.getElementById('inp-hora').value || "",
      desc: document.getElementById('inp-desc').value.trim() || "",
      done: false, creadaEn: Date.now(), open: false
    });
    ['inp-tarea','inp-desc','inp-fecha','inp-hora'].forEach(id => document.getElementById(id).value = "");
  };

  window.toggle = async (id, status) => { await updateDoc(doc(db, "tareas_equipo", id), { done: !status }); };
  window.del = async (id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, "tareas_equipo", id)); };
  
  // Función para abrir/cerrar detalle (como tenías en tu código original)
  window.toggleDetail = (id) => {
    const row = document.getElementById('desc-' + id);
    const btn = document.getElementById('btn-' + id);
    if(row.style.display === 'table-row') {
      row.style.display = 'none';
      btn.innerText = '▾ ver detalle';
    } else {
      row.style.display = 'table-row';
      btn.innerText = '▴ ocultar';
    }
  };

  // Escuchar y ordenar por FECHA ASCENDENTE (Próxima entrega arriba)
  onSnapshot(query(tasksRef, orderBy("fecha", "asc")), (snap) => {
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });

  function render() {
    const tbody = document.getElementById('tbody-tasks');
    if(!tbody || !currentPersona) return;
    const mine = tasks.filter(t => t.resp === currentPersona);

    tbody.innerHTML = mine.map(t => {
      const fDisplay = t.fecha === "9999-12-31" ? "—" : t.fecha;
      return `
      <tr>
        <td style="width:40px"><input type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}', ${t.done})"></td>
        <td>
          <div class="${t.done?'done-t':''}"><strong>${t.tarea}</strong></div>
          ${t.desc ? `<div><button id="btn-${t.id}" class="btn-expand" onclick="toggleDetail('${t.id}')">▾ ver detalle</button></div>` : ''}
        </td>
        <td style="font-family:'DM Mono', monospace; font-size:12px;">${fDisplay} ${t.hora}</td>
        <td style="width:40px"><button onclick="del('${t.id}')" style="background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:16px;">×</button></td>
      </tr>
      <tr class="task-desc-row" id="desc-${t.id}">
        <td colspan="4"><div class="task-desc-content">${t.desc}</div></td>
      </tr>
    `}).join('');
  }
</script>
</body>
</html>
